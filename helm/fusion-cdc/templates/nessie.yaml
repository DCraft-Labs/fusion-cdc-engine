{{- if .Values.nessie.enabled }}
# v1.2.37 §1 + §8 item 1: Nessie catalog with a persistent backend.
# Default in-memory version store wipes the entire Iceberg catalog on every
# pod restart — a Priority-0 data-loss bug. This template deploys Nessie
# with either a JDBC backend (preferred — point at a managed Postgres) or a
# RocksDB + PVC fallback, plus a PVC that survives pod restarts either way.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fusion-cdc.fullname" . }}-nessie
  labels:
    app.kubernetes.io/name: nessie
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    {{- range .Values.nessie.persistence.accessModes }}
    - {{ . | quote }}
    {{- end }}
  resources:
    requests:
      storage: {{ .Values.nessie.persistence.size | quote }}
  {{- with .Values.nessie.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fusion-cdc.fullname" . }}-nessie
  labels:
    app.kubernetes.io/name: nessie
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.nessie.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nessie
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nessie
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.nessie.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nessie
          image: "{{ .Values.nessie.image.repository }}:{{ .Values.nessie.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.nessie.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ .Values.nessie.service.apiPort }}
            - name: mgmt
              containerPort: {{ .Values.nessie.service.mgmtPort }}
          env:
            - name: QUARKUS_HTTP_PORT
              value: {{ .Values.nessie.service.apiPort | quote }}
            - name: NESSIE_VERSION_STORE_TYPE
              value: {{ .Values.nessie.backend.type | quote }}
            {{- if eq .Values.nessie.backend.type "JDBC" }}
            {{- if .Values.nessie.backend.jdbc.existingSecret }}
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nessie.backend.jdbc.existingSecret }}
                  key: NESSIE_JDBC_URL
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nessie.backend.jdbc.existingSecret }}
                  key: NESSIE_JDBC_USER
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nessie.backend.jdbc.existingSecret }}
                  key: NESSIE_JDBC_PASSWORD
            {{- else }}
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: {{ .Values.nessie.backend.jdbc.url | quote }}
            - name: QUARKUS_DATASOURCE_JDBC_DRIVER
              value: {{ .Values.nessie.backend.jdbc.driver | quote }}
            - name: QUARKUS_DATASOURCE_USERNAME
              value: {{ .Values.nessie.backend.jdbc.user | quote }}
            - name: QUARKUS_DATASOURCE_PASSWORD
              value: {{ .Values.nessie.backend.jdbc.password | quote }}
            {{- end }}
            {{- else if eq .Values.nessie.backend.type "ROCKSDB" }}
            - name: NESSIE_VERSION_STORE_PERSISTENCE_ROCKS_DATABASE_PATH
              value: {{ .Values.nessie.persistence.mountPath | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/v1/config
              port: api
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/config
              port: api
            periodSeconds: 5
          {{- with .Values.nessie.containerSecurityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: nessie-data
              mountPath: {{ .Values.nessie.persistence.mountPath }}
          {{- with .Values.nessie.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: nessie-data
          {{- if .Values.nessie.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "fusion-cdc.fullname" . }}-nessie
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fusion-cdc.fullname" . }}-nessie
  labels:
    app.kubernetes.io/name: nessie
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.nessie.service.type }}
  selector:
    app.kubernetes.io/name: nessie
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: {{ .Values.nessie.service.apiPort }}
      targetPort: api
    - name: mgmt
      port: {{ .Values.nessie.service.mgmtPort }}
      targetPort: mgmt
{{- end }}
