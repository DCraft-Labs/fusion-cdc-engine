apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-control-plane-sa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-cdc.labels" . | nindent 4 }}
# Needs a mounted token now: app/services/committer_provisioner.py calls
# kubernetes.config.load_incluster_config(), which requires the projected
# SA token file to actually exist in the pod. cdc-worker-sa (below) has no
# such need and stays automount-disabled.
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cdc-worker-sa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-cdc.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-control-plane-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Dynamic per-connection Iceberg committer provisioning
  # (app/services/committer_provisioner.py) — creates/updates/deletes the
  # committer Deployment + its catalog-config Secret + headless metrics
  # Service directly, replacing the old manual helm values.committer.targets
  # + `helm upgrade` workflow.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-control-plane-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-control-plane-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-control-plane-role
  apiGroup: rbac.authorization.k8s.io
