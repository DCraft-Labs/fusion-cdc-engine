name: Publish CDC images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-cdc-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # v1.2.20: run the unit + contract tests before publishing images. The
  # routing / postgres-initial-load / connection-lifecycle tests are
  # dependency-light (they stub psycopg2 / pymysql / redis / paramiko and
  # load source files directly) so they run on a bare Python 3 image with
  # only pytest installed.
  test:
    name: unit + contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - name: Routing rule tests (v1.2.20 Fix C)
        run: |
          python -m pytest \
            control-plane/tests/test_connections/test_routing_v120.py \
            -q --noconftest -p no:cacheprovider
      - name: Postgres initial-load tests (v1.2.20 Fix B)
        run: |
          python -m pytest \
            cdc-workers/tests/test_initial_load_postgres.py \
            -q --noconftest -p no:cacheprovider
      - name: Connection lifecycle contract tests (v1.2.20 Fix D)
        run: |
          python -m pytest \
            tests/integration/test_connection_lifecycle.py \
            -q --noconftest -p no:cacheprovider
      - name: Post-rollout unit tests (v1.3.6 + v1.3.7)
        run: |
          python -m pytest \
            tests/unit/test_v136_ranges_overlap.py \
            tests/unit/test_v136_task_bulk_committer_modes.py \
            tests/unit/test_v137_post_rollout_bugfixes.py \
            -q --noconftest -p no:cacheprovider
      - name: cdc-worker source-assignment/sharding tests (Phase 2)
        run: |
          python -m pytest \
            control-plane/tests/test_connections/test_source_assignment_p2.py \
            -q --noconftest -p no:cacheprovider
      - name: Setup Helm (for v1.3.5 chart template assertions)
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Build chart deps (redis subchart) for helm template tests
        run: |
          helm dependency build helm/fusion-cdc
      - name: Transform-worker unit tests (v1.2.22 Bug A + Bug B + Fix C + v1.3.5 Fix 4)
        env:
          HELM_BIN: helm
        run: |
          python -m pip install --quiet pyarrow==16.0.0 duckdb==0.10.3 \
            requests==2.31.0 pymysql==1.1.1 psycopg2-binary==2.9.9 \
            redis==5.0.4
          python -m pytest \
            transform-worker/tests/ \
            -q -p no:cacheprovider

  publish:
    name: publish-${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane
            image: fusion-cdc-control-plane
            file: docker/Dockerfile.control-plane
            platforms: linux/amd64,linux/arm64
          - name: worker
            image: fusion-cdc-worker
            file: docker/Dockerfile.cdc-worker
            platforms: linux/amd64,linux/arm64
          - name: frontend
            image: fusion-cdc-frontend
            file: docker/Dockerfile.frontend
            platforms: linux/amd64
          - name: transform-worker
            image: fusion-cdc-transform-worker
            file: docker/Dockerfile.transform-worker
            platforms: linux/amd64,linux/arm64
          # spark-consumer intentionally omitted: bitnami/spark:3.5 is gone from Docker Hub,
          # and product direction prefers DuckDB transform-worker for landing.
    steps:
      - uses: actions/checkout@v5

      - name: Derive tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" == v* ]]; then SEMVER="${REF#v}"; else SEMVER="0.0.0-${GITHUB_SHA:0:12}"; fi
          SHA_SHORT="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          IMAGE="ghcr.io/dcraft-labs/${{ matrix.image }}"
          {
            echo "image=${IMAGE}"
            echo "semver=${SEMVER}"
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${SEMVER}"
            echo "${IMAGE}:sha-${SHA_SHORT}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          # v1.3.5 Fix 1: bake OCI provenance labels into the image so the
          # published image carries its source git SHA + tag. The post-build
          # verification step below asserts the revision label matches the
          # tag's commit SHA before the workflow succeeds — catching the
          # class of mismatch where the published image wasn't actually
          # built from the tagged commit (v1.3.3 was built from v1.3.1-level
          # source). These labels override any same-key LABELs in the
          # Dockerfiles (docker/build-push-action merges them, later wins).
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.semver }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # v1.3.5 Fix 1: post-build provenance verification. After the push,
      # pull the published image (amd64 variant on the amd64 runner) and
      # read its org.opencontainers.image.revision label via docker inspect,
      # then assert it equals the tagged commit SHA. If mismatch, fail the
      # workflow. This catches the v1.3.3 integrity failure (image built
      # from v1.3.1-level source) automatically before the release is
      # considered green. (docker buildx imagetools inspect --format
      # '{{ json .Image }}' returns null for multi-platform manifests, so
      # we use docker pull + docker inspect which reliably reads the
      # config labels from the pulled platform variant.)
      - name: Verify provenance label matches tag SHA
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          SEMVER: ${{ steps.meta.outputs.semver }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "==> pulling ${IMAGE}:${SEMVER} to inspect provenance label"
          docker pull "${IMAGE}:${SEMVER}" >/dev/null
          ACTUAL_SHA="$(docker inspect "${IMAGE}:${SEMVER}" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          echo "    expected SHA: ${EXPECTED_SHA}"
          echo "    actual SHA:   ${ACTUAL_SHA}"
          if [[ -z "${ACTUAL_SHA}" ]]; then
            echo "ERROR: org.opencontainers.image.revision label is missing from ${IMAGE}:${SEMVER}"
            exit 1
          fi
          if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "ERROR: provenance mismatch — image revision label (${ACTUAL_SHA}) != tag SHA (${EXPECTED_SHA})"
            exit 1
          fi
          echo "OK: provenance label matches tag SHA"

